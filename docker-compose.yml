services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SESSION_SECRET=${SESSION_SECRET:-shopsphere-production-session-secret-key-998877}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AGENTS_ENABLED=${AGENTS_ENABLED:-true}
      - AGENT_DEFAULT_MODEL=${AGENT_DEFAULT_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - AGENT_DEFAULT_FALLBACK_MODEL=${AGENT_DEFAULT_FALLBACK_MODEL:-google/gemini-2.0-flash-lite-preview:free}
      - AGENT_TIMEOUT_MS=30000
      - AGENT_MAX_TOOL_ITERATIONS=6
      - REFUND_AUTO_APPROVE_MAX_PAISE=200000
    volumes:
      - sqlite_data:/app/src/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shopsphere-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shopsphere-net

volumes:
  sqlite_data:
    name: shopsphere_sqlite_data

networks:
  shopsphere-net:
    name: shopsphere-net
    driver: bridge
